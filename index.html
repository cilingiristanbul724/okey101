<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // SPA yonlendirme cozucu: 404.html'den gelen ?/ formatini gercek yola cevirir.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
